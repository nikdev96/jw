services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nikita
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: botshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikita -d botshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # Hot reload
    environment:
      DATABASE_URL: postgresql+asyncpg://nikita:dev_password@postgres:5432/botshop
      DEBUG: "true"
      FRONTEND_URL: http://localhost:3000
      FRONTEND_DEV_URL: http://localhost:3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MANAGER_CHAT_ID: ${MANAGER_CHAT_ID:-123456789}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src  # Hot reload
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
